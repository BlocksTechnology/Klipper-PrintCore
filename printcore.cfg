# Print core amovível: ID do nozzle por código de resistências + modo de troca.
# Módulo: extras/printcore.py (copiar ou fazer symlink para klipper/klippy/extras/).
#
# O [extruder] NÃO muda. Fora do modo de troca a proteção do sensor do hotend
# é a normal do Klipper (shutdown se o print core for retirado).

[printcore]
heater: extruder
# Entrada de termistor da EBB36 (PA3), alias definido em hardware/EBB-36.cfg
id_pin: Toolhead: EBB36_TH0
# O ID é lido em "counts" de 12 bits (0-4096), a mesma escala da tabela
# Print_core_-_Code_Table.xlsx (V / (3.3 / 4096), pull-up de 4.7k).
# Janela de aceitação de cada nozzle: counts +/- id_tolerance.
# O máximo possível com esta tabela é 22 (o par mais próximo está a 45 counts).
id_tolerance: 15
# Acima disto considera-se "sem print core" (ID em aberto lê ~4095)
absent_counts: 3800
# "nome: counts". Valores = MÉDIA medida (folha "Folha Lemos", tabela recente,
# 4 print cores x 3 leituras). Ordem por código L1 L2 L3 L4.
# Standard = células verdes da tabela; hightemp = laranja (L1 = 1).
# Os códigos "exp" (1110 e 1111) NÃO estão na tabela de propósito: ficam
# "unknown" e bloqueiam o aquecimento. O 1111 lê ~0, igual a um ID em curto.
nozzles:
    0.4_standard: 2815
    0.2_standard: 2571
    0.3_standard: 2616
    0.5_standard: 2283
    0.6_standard: 2232
    0.8_standard: 1665
    1.0_standard: 1778
    1.2_standard: 835
    0.3_hightemp: 2704
    0.4_hightemp: 2411
    0.5_hightemp: 2467
    0.6_hightemp: 2052
    0.8_hightemp: 1985
    1.0_hightemp: 1231
# Leituras (a ~0.3 s cada) para aceitar uma mudança de ID
debounce_samples: 3
# Só se entra e só se termina uma troca abaixo desta temperatura
safe_temp: 50
# Temperatura mínima aceite no teste final da troca
swap_min_temp: 0
# Segundos até shutdown se a troca não for terminada (0 = sem limite).
# Aos 60 s do fim há um aviso; PRINTCORE_SWAP_EXTEND dá mais tempo.
swap_timeout: 1200
# Opcional: código de serviço. Se definido, ligar o bypass do ID (cabo do ID
# partido) exige CODE=<valor>; o cliente vê só "contacte o suporte".
# bypass_code: 1234
# A POSIÇÃO DE TROCA (X, Y, Z) NÃO ESTÁ AQUI: está na tabela da macro
# PRINT_CORE_POSITIONS, em config/print_core_change.cfg.
# Depois da troca o nozzle pode ter outra altura: obriga a novo home (G28).
rehome_after_swap: True
# Durante a troca o G28, G0/G1/G2/G3, probes, BEACON_*, Z_TILT_ADJUST, etc. são
# recusados (lista no printcore.py) e o toolhead recusa qualquer movimento.
# Comandos teus que mexam a máquina e não estejam na lista (separados por vírgula):
#swap_block_extra: MEU_COMANDO
# Leituras diretas do RTD ao terminar a troca, e dispersão máxima aceite
swap_samples: 5
swap_max_spread: 2.0

# Mensagens na consola: 0 = simples (utilizador), 1 = detalhadas (developer).
# Em runtime, sem reiniciar: PRINTCORE_LOG LEVEL=0|1
log_level: 0

# Linha de ID com problema (cabo/contacto). Se o ID diz "ausente/desconhecido"
# mas o RTD lê bem durante estes segundos, o módulo avisa e passa a aceitar:
#   PRINTCORE_ID_BYPASS NOZZLE=<nome> CONFIRM=1
# O bypass fica guardado em variables.cfg ([save_variables]), mantém todas as
# proteções do RTD e desfaz-se sozinho quando o ID volta a ler bem.
# Remover à mão: PRINTCORE_ID_BYPASS CLEAR=1
id_fault_secs: 5

[gcode_macro PRINT_CORE_CHANGE_DONE]
description: Finishes the print core swap, restores normal protection and homes the printer
gcode:
    # If PRINTCORE_SWAP_END fails the macro stops here, the swap stays active and G28 does not run.
    PRINTCORE_SWAP_END {rawparams} AUTOHOME=1
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    G28
