# ============================================================================
# TABELA DE POSIÇÕES DO PRINT CORE  (edita só aqui)
# Coordenadas da MÁQUINA em mm (as de printer.toolhead.position, não as do
# G-code: não levam offsets). Para achar a posição certa: põe a cabeça onde
# queres trocar o print core e corre PRINT_CORE_SWAP_POS_FROM_HERE, que
# escreve as linhas já no formato desta tabela.
# Valores de arranque = os do PRINT_CORE_CHANGE antigo (X a meio, Y250, Z50).
# ============================================================================
[gcode_macro PRINT_CORE_POSITIONS]
description: Shows the print core swap position table
variable_swap_x: 251     # antigo: axis_maximum.x / 2
variable_swap_y: 250
variable_swap_z: 50
variable_speed_xy: 150   # mm/s
variable_speed_z: 10     # mm/s (o Klipper limita ao max_z_velocity)
gcode:
    RESPOND MSG="Swap position: X{swap_x} Y{swap_y} Z{swap_z} (XY {speed_xy} mm/s, Z {speed_z} mm/s)"

[gcode_macro PRINT_CORE_SWAP_POS_FROM_HERE]
description: Shows the current toolhead position in the table format
gcode:
    {% set p = printer.toolhead.position %}
    RESPOND MSG="Copy into PRINT_CORE_POSITIONS in config/print_core_change.cfg:"
    RESPOND MSG="variable_swap_x: {"%.1f"|format(p.x)}"
    RESPOND MSG="variable_swap_y: {"%.1f"|format(p.y)}"
    RESPOND MSG="variable_swap_z: {"%.1f"|format(p.z)}"

[gcode_macro PRINT_CORE_GOTO_POSITION]
description: Moves to the table position without entering swap mode (to test values)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY
    {% endif %}

# ============================================================================
# FLUXO DA TROCA DO PRINT CORE
#
#   PRINT_CORE_CHANGE
#     1. recusa se há impressão em curso ou troca já ativa
#     2. filamento no toolhead (sensor ou estado do Happy Hare)?
#          sim -> MMU_UNLOAD, depois confirma que o toolhead ficou livre
#     3. MMU_EJECT: tira o filamento da gate, fica ANTES da gate
#          (depois de um unload, ou se o sensor da gate ainda deteta filamento)
#     4. prepara: home se for preciso (sem limpar o nozzle),
#          vai à posição da tabela, arrefece
#     5. confirma: gate livre, toolhead livre e estado Unloaded (_PRINT_CORE_VERIFY),
#          logo depois do eject (antes de mexer) e outra vez depois de arrefecer
#     6. PRINTCORE_SWAP_START (modo de troca: aquecimento e movimento bloqueados)
#   PRINT_CORE_CHANGE_DONE  termina a troca (macro em printcore.cfg)
#
# Qualquer confirmação que falhe aborta ANTES do modo de troca, com uma
# mensagem a dizer o que cada sensor leu.
#
# O Klipper avalia o texto de uma macro de uma vez, ANTES de executar as suas
# linhas. Por isso cada etapa é uma macro própria: assim os sensores são lidos
# de novo depois do MMU_UNLOAD, do MMU_EJECT e do arrefecimento.
#
# Sensores (printer.mmu.sensors): toolhead e mmu_gate. Se um não existir conta
# como "com filamento" (conservador). Estado: printer.mmu.filament tem de ser
# "Unloaded". Sem Happy Hare ativo não há descarregamento automático: usa a
# variável antiga filament_loaded e pede-te para descarregares à mão.
#
# Estado para o ecrã (variável phase de PRINT_CORE_CHANGE):
#   idle | unloading | preparing | prepared
# unloading = descarregar e ejetar; preparing = home, posição e
# arrefecimento; prepared = modo de troca ativo, à espera do print core.
# Só passa a prepared se o PRINTCORE_SWAP_START tiver sucesso, e volta a idle
# quando o PRINT_CORE_CHANGE_DONE termina a troca. Se uma etapa falhar a meio a
# fase pode ficar em unloading/preparing: PRINT_CORE_CHANGE_CANCEL ou um novo
# pedido repõem idle.
# ============================================================================
[gcode_macro PRINT_CORE_CHANGE]
description: Print core swap. Unloads and ejects the filament (before the gate), checks the sensors and enters swap mode
variable_phase: 'idle'        # idle | unloading | preparing | prepared
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is in progress (%s): cancel it before swapping the print core" % printer.print_stats.state)}
    {% endif %}
    {% if printer.printcore.swap_active %}
        {action_raise_error("A swap is already in progress: finish it with PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    {% set mmu_on = 'mmu' in printer and printer.mmu.enabled|default(true) %}
    {% set s = printer.mmu.sensors|default({}) if mmu_on else {} %}
    {% set th_clear = s.toolhead is defined and s.toolhead is sameas false %}
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% if mmu_on %}
        {% if not th_clear or printer.mmu.filament|default('Unknown') != 'Unloaded' %}
            _PRINT_CORE_UNLOAD
        {% else %}
            _PRINT_CORE_EJECT UNLOADED_NOW=0
        {% endif %}
    {% elif sv.filament_loaded|default(true) %}
        _PRINT_CORE_ABORT MSG="Happy Hare is not active and filament_loaded says filament is loaded (or is not saved): unload it by hand and run PRINT_CORE_CHANGE again."
    {% else %}
        _PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW=0
    {% endif %}

[gcode_macro PRINT_CORE_CHANGE_CANCEL]
description: Resets the swap phase to idle (only before swap mode)
gcode:
    {% if printer.printcore.swap_active %}
        {action_raise_error("Swap in progress: finish it with PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    RESPOND MSG="Print core swap phase reset (idle)."

# --- Etapas internas ---------------------------------------------------------

[gcode_macro _PRINT_CORE_UNLOAD]
description: Internal: unloads the filament from the toolhead
gcode:
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'unloading'"
    RESPOND MSG="Filament detected in the toolhead: unloading (MMU_UNLOAD)..."
    MMU_UNLOAD RESTORE=0
    _PRINT_CORE_EJECT UNLOADED_NOW=1

[gcode_macro _PRINT_CORE_EJECT]
description: Internal: checks the toolhead is clear and ejects the filament to before the gate
gcode:
    {% set unloaded_now = params.UNLOADED_NOW|default(0)|int == 1 %}
    {% set s = printer.mmu.sensors|default({}) %}
    {% set th_clear = s.toolhead is defined and s.toolhead is sameas false %}
    {% set gate_clear = s.mmu_gate is defined and s.mmu_gate is sameas false %}
    {% if not th_clear or printer.mmu.filament|default('Unknown') != 'Unloaded' %}
        _PRINT_CORE_ABORT MSG="UNLOAD FAILED: toolhead={s.toolhead|default('n/a')} state={printer.mmu.filament|default('n/a')}. Swap aborted, swap mode not entered."
    {% else %}
        SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'unloading'"
        {% if unloaded_now or not gate_clear %}
            RESPOND MSG="Ejecting the filament to before the gate (MMU_EJECT)..."
            MMU_EJECT
        {% endif %}
        _PRINT_CORE_VERIFY THEN="_PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW={1 if unloaded_now else 0}"
    {% endif %}

[gcode_macro _PRINT_CORE_CHANGE_PREPARE]
description: Internal: home, swap position and cooldown
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% set unloaded_now = params.UNLOADED_NOW|default(0)|int == 1 %}
    {% set hn = printer.printcore.heater %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'preparing'"
    # Aquecedor desligado logo no início: arrefece enquanto a cabeça se move.
    SET_HEATER_TEMPERATURE HEATER={hn} TARGET=0
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M400
    G90
    # Sem limpeza do nozzle na troca (decisão do utilizador): o PRINT_START limpa antes de cada impressão.
    M400
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY
    {% endif %}
    _PRINT_CORE_COOLDOWN
    _PRINT_CORE_VERIFY_FINAL THEN="_PRINT_CORE_CHANGE_LOCK"

# Só espera (e só avisa) se o hotend estiver mesmo acima de 45 C. É uma macro
# própria para a temperatura ser lida depois dos movimentos, não antes.
[gcode_macro _PRINT_CORE_COOLDOWN]
description: Internal: waits for the hotend to cool below 45 C, only if it is hotter
gcode:
    {% set hn = printer.printcore.heater %}
    {% set temp = printer[hn].temperature|float %}
    {% if temp > 45 %}
        RESPOND MSG="Cooling the hotend for the print core swap ({'%.0f' % temp} C -> 45 C)..."
        TEMPERATURE_WAIT SENSOR={hn} MAXIMUM=45
    {% endif %}

# Aborta a troca: repõe a fase a idle e levanta um erro de G-code, que pára
# também qualquer macro que tenha chamado PRINT_CORE_CHANGE. É preciso ser em
# duas macros: um erro levantado ao renderizar impede as linhas da própria
# macro de correr, por isso o SET_GCODE_VARIABLE fica na primeira e o erro na
# segunda. Sem aspas dentro de MSG.
[gcode_macro _PRINT_CORE_ABORT]
description: Internal: resets the swap phase and raises an error
gcode:
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    _PRINT_CORE_RAISE MSG="{params.MSG}"

[gcode_macro _PRINT_CORE_RAISE]
description: Internal: raises a G-code error with the given message
gcode:
    {action_raise_error(params.MSG|default("Print core swap aborted"))}

# Único sítio com o critério final: gate livre, toolhead livre e estado Unloaded.
# Corre THEN só se os três se verificarem; senão aborta antes do modo de troca.
[gcode_macro _PRINT_CORE_VERIFY]
description: Internal: checks gate and toolhead are clear and state is Unloaded
gcode:
    {% set mmu_on = 'mmu' in printer and printer.mmu.enabled|default(true) %}
    {% set s = printer.mmu.sensors|default({}) if mmu_on else {} %}
    {% set th_clear = s.toolhead is defined and s.toolhead is sameas false %}
    {% set gate_clear = s.mmu_gate is defined and s.mmu_gate is sameas false %}
    {% if mmu_on and (not th_clear or not gate_clear or printer.mmu.filament|default('Unknown') != 'Unloaded') %}
        _PRINT_CORE_ABORT MSG="FILAMENT DETECTED: gate={s.mmu_gate|default('n/a')} toolhead={s.toolhead|default('n/a')} state={printer.mmu.filament|default('n/a')}. Swap aborted, swap mode not entered."
    {% else %}
        {params.THEN}
    {% endif %}

# Segunda cópia de _PRINT_CORE_VERIFY. O Klipper recusa uma macro chamada de dentro
# dela própria ("called recursively"), e o THEN da primeira corre dentro dela, por
# isso a verificação final depois do arrefecimento tem de ser outra macro.
[gcode_macro _PRINT_CORE_VERIFY_FINAL]
description: Internal: same check as _PRINT_CORE_VERIFY, second copy
gcode:
    {% set mmu_on = 'mmu' in printer and printer.mmu.enabled|default(true) %}
    {% set s = printer.mmu.sensors|default({}) if mmu_on else {} %}
    {% set th_clear = s.toolhead is defined and s.toolhead is sameas false %}
    {% set gate_clear = s.mmu_gate is defined and s.mmu_gate is sameas false %}
    {% if mmu_on and (not th_clear or not gate_clear or printer.mmu.filament|default('Unknown') != 'Unloaded') %}
        _PRINT_CORE_ABORT MSG="FILAMENT DETECTED: gate={s.mmu_gate|default('n/a')} toolhead={s.toolhead|default('n/a')} state={printer.mmu.filament|default('n/a')}. Swap aborted, swap mode not entered."
    {% else %}
        {params.THEN}
    {% endif %}

[gcode_macro _PRINT_CORE_CHANGE_LOCK]
description: Internal: enters swap mode (heating and motion blocked)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    PRINTCORE_SWAP_START X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    # Só chega aqui se o PRINTCORE_SWAP_START teve sucesso
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'prepared'"
    RESPOND MSG="Gate and toolhead clear. Swap the print core, then run PRINT_CORE_CHANGE_DONE"
