# ============================================================================
# TABELA DE POSIÇÕES DO PRINT CORE  (edita só aqui)
# Coordenadas da MÁQUINA em mm (as de printer.toolhead.position, não as do
# G-code: não levam offsets). Para achar a posição certa: põe a cabeça onde
# queres trocar o print core e corre PRINT_CORE_SWAP_POS_FROM_HERE, que
# escreve as linhas já no formato desta tabela.
# Valores de arranque = os do PRINT_CORE_CHANGE antigo (X a meio, Y250, Z50).
# ============================================================================
[gcode_macro PRINT_CORE_POSITIONS]
description: Mostra a tabela de posições do print core
variable_swap_x: 251     # antigo: axis_maximum.x / 2
variable_swap_y: 250
variable_swap_z: 50
variable_speed_xy: 150   # mm/s
variable_speed_z: 10     # mm/s (o Klipper limita ao max_z_velocity)
gcode:
    RESPOND MSG="Posição de troca: X{swap_x} Y{swap_y} Z{swap_z} (XY {speed_xy} mm/s, Z {speed_z} mm/s)"

[gcode_macro PRINT_CORE_SWAP_POS_FROM_HERE]
description: Mostra a posição atual da cabeça no formato da tabela
gcode:
    {% set p = printer.toolhead.position %}
    RESPOND MSG="Copia para PRINT_CORE_POSITIONS em config/print_core_change.cfg:"
    RESPOND MSG="variable_swap_x: {"%.1f"|format(p.x)}"
    RESPOND MSG="variable_swap_y: {"%.1f"|format(p.y)}"
    RESPOND MSG="variable_swap_z: {"%.1f"|format(p.z)}"

[gcode_macro PRINT_CORE_GOTO_POSITION]
description: Vai à posição da tabela, sem modo de troca (para testar valores)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY MOVE_TO_PARK=False
    {% endif %}

# ============================================================================
# FLUXO DA TROCA DO PRINT CORE
#
#   PRINT_CORE_CHANGE
#     1. recusa se há impressão em curso ou troca já ativa
#     2. filamento no toolhead (sensor ou estado do Happy Hare)?
#          sim -> MMU_UNLOAD, depois confirma que o toolhead ficou livre
#     3. MMU_EJECT: tira o filamento da gate, fica ANTES da gate
#          (depois de um unload, ou se o sensor da gate ainda deteta filamento)
#     4. prepara: home se for preciso, limpa o nozzle (só se não houve unload),
#          vai à posição da tabela, arrefece
#     5. confirma: gate livre, toolhead livre e estado Unloaded (_PRINT_CORE_VERIFY),
#          logo depois do eject (antes de mexer) e outra vez depois de arrefecer
#     6. PRINTCORE_SWAP_START (modo de troca: aquecimento e movimento bloqueados)
#   PRINT_CORE_CHANGE_DONE  termina a troca (macro em printcore.cfg)
#
# Qualquer confirmação que falhe aborta ANTES do modo de troca, com uma
# mensagem a dizer o que cada sensor leu.
#
# O Klipper avalia o texto de uma macro de uma vez, ANTES de executar as suas
# linhas. Por isso cada etapa é uma macro própria: assim os sensores são lidos
# de novo depois do MMU_UNLOAD, do MMU_EJECT e do arrefecimento.
#
# Sensores (printer.mmu.sensors): toolhead e mmu_gate. Se um não existir conta
# como "com filamento" (conservador). Estado: printer.mmu.filament tem de ser
# "Unloaded". Sem Happy Hare ativo não há descarregamento automático: usa a
# variável antiga filament_loaded e pede-te para descarregares à mão.
#
# Estado para o ecrã (variável phase de PRINT_CORE_CHANGE):
#   idle | unloading | preparing
# unloading = descarregar e ejetar; preparing = home, limpeza, posição e
# arrefecimento. Quando o modo de troca arranca a fase volta a idle e o ecrã
# deve ler printcore.swap_active. Se uma etapa falhar a meio a fase pode ficar
# em unloading/preparing: PRINT_CORE_CHANGE_CANCEL ou um novo pedido repõem idle.
# ============================================================================
[gcode_macro PRINT_CORE_CHANGE]
description: Troca do print core. Descarrega e ejeta o filamento (antes da gate), confirma os sensores e entra em modo de troca
variable_phase: 'idle'        # idle | unloading | preparing
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Há uma impressão em curso (%s): cancela-a antes de trocar o print core" % printer.print_stats.state)}
    {% endif %}
    {% if printer.printcore.swap_active %}
        {action_raise_error("Já há uma troca em curso: termina-a com PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    {% set mmu_on = 'mmu' in printer and printer.mmu.enabled|default(true) %}
    {% set s = printer.mmu.sensors|default({}) if mmu_on else {} %}
    {% if mmu_on %}
        {% if s.toolhead|default(true) or printer.mmu.filament|default('Unknown') != 'Unloaded' %}
            _PRINT_CORE_UNLOAD
        {% else %}
            _PRINT_CORE_EJECT UNLOADED_NOW=0
        {% endif %}
    {% elif printer.save_variables.variables.filament_loaded|default(true) %}
        RESPOND TYPE=error MSG="Sem Happy Hare ativo e filament_loaded indica filamento carregado: descarrega à mão e volta a correr PRINT_CORE_CHANGE."
    {% else %}
        _PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW=0
    {% endif %}

[gcode_macro PRINT_CORE_CHANGE_CANCEL]
description: Repõe o estado da troca para idle (só antes do modo de troca)
gcode:
    {% if printer.printcore.swap_active %}
        {action_raise_error("Troca em curso: termina-a com PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    RESPOND MSG="Estado da troca do print core reposto (idle)."

# --- Etapas internas ---------------------------------------------------------

[gcode_macro _PRINT_CORE_UNLOAD]
description: Interna: descarrega o filamento do toolhead
gcode:
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'unloading'"
    RESPOND MSG="Filamento detetado no toolhead: a descarregar (MMU_UNLOAD)..."
    MMU_UNLOAD RESTORE=0
    _PRINT_CORE_EJECT UNLOADED_NOW=1

[gcode_macro _PRINT_CORE_EJECT]
description: Interna: confirma o toolhead livre e ejeta o filamento para antes da gate
gcode:
    {% set unloaded_now = params.UNLOADED_NOW|default(0)|int == 1 %}
    {% set s = printer.mmu.sensors|default({}) %}
    {% if s.toolhead|default(true) or printer.mmu.filament|default('Unknown') != 'Unloaded' %}
        SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
        RESPOND TYPE=error MSG="DESCARREGAMENTO FALHOU: toolhead={s.toolhead|default('n/d')} estado={printer.mmu.filament|default('n/d')}. Troca abortada, não entrou em modo de troca."
    {% else %}
        SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'unloading'"
        {% if unloaded_now or s.mmu_gate|default(true) %}
            RESPOND MSG="A ejetar o filamento para antes da gate (MMU_EJECT)..."
            MMU_EJECT
        {% endif %}
        _PRINT_CORE_VERIFY THEN="_PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW={1 if unloaded_now else 0}"
    {% endif %}

[gcode_macro _PRINT_CORE_CHANGE_PREPARE]
description: Interna: home, limpeza, posição de troca e arrefecimento
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% set unloaded_now = params.UNLOADED_NOW|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'preparing'"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M400
    G90
    # Como antes: depois de um descarregamento a limpeza do nozzle é saltada.
    {% if not unloaded_now %}
        CLEAN_NOZZLE
    {% endif %}
    M400
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY MOVE_TO_PARK=False
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    RESPOND MSG="A arrefecer o hotend para a troca do print core..."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=45
    _PRINT_CORE_VERIFY THEN="_PRINT_CORE_CHANGE_LOCK"

# Único sítio com o critério final: gate livre, toolhead livre e estado Unloaded.
# Corre THEN só se os três se verificarem; senão aborta antes do modo de troca.
[gcode_macro _PRINT_CORE_VERIFY]
description: Interna: confirma gate e toolhead livres e estado Unloaded
gcode:
    {% set mmu_on = 'mmu' in printer and printer.mmu.enabled|default(true) %}
    {% set s = printer.mmu.sensors|default({}) if mmu_on else {} %}
    {% if mmu_on and (s.toolhead|default(true) or s.mmu_gate|default(true) or printer.mmu.filament|default('Unknown') != 'Unloaded') %}
        SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
        RESPOND TYPE=error MSG="FILAMENTO DETETADO: gate={s.mmu_gate|default('n/d')} toolhead={s.toolhead|default('n/d')} estado={printer.mmu.filament|default('n/d')}. Troca abortada, não entrou em modo de troca."
    {% else %}
        {params.THEN}
    {% endif %}

[gcode_macro _PRINT_CORE_CHANGE_LOCK]
description: Interna: entra em modo de troca (aquecimento e movimento bloqueados)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    PRINTCORE_SWAP_START X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    RESPOND MSG="Gate e toolhead livres. Troca o print core e corre PRINT_CORE_CHANGE_DONE"
